name: Build & Deploy Spring Boot to EC2

on:
  push:
    branches: ["master"]
  release:
    types: [published]

jobs:
  build:
    name: Build and publish Maven package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build and publish package
        run: bash ./mvnw clean deploy -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/demojavaapp-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: .

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "demojavaapp-0.0.1-SNAPSHOT.jar"
          target: "~/"

      - name: Restart Spring Boot app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: '8080'
          script: |
            pkill -f '[d]emojavaapp-0.0.1-SNAPSHOT.jar' || true
            nohup java -jar ~/demojavaapp-0.0.1-SNAPSHOT.jar > ~/app.log 2>&1 &